basePath: /api
definitions:
  ds.Composer:
    properties:
      creator_id:
        type: integer
      current_user_is_creator:
        type: boolean
      date_create:
        type: string
      date_formed:
        type: string
      description:
        type: string
      freq1:
        type: number
      freq2:
        type: number
      id:
        type: integer
      image_url:
        type: string
      name:
        type: string
      status:
        type: string
      video_url:
        type: string
    type: object
  handler.loginReq:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  handler.registerReq:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  description: Backend API for Composers SPA (LR4)
  title: Composers API
  version: "1.0"
paths:
  /composer:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Имя композитора
        in: formData
        name: name
        required: true
        type: string
      - description: Изображение
        in: formData
        name: pic
        type: file
      - description: Видео
        in: formData
        name: video
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ds.Composer'
      security:
      - BearerAuth: []
      summary: Создание черновика композитора
      tags:
      - composers
  /composer/{id}:
    delete:
      parameters:
      - description: ID композитора
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Удаление композитора
      tags:
      - composers
  /composer/{id}/like:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: ID композитора
        in: path
        name: id
        required: true
        type: integer
      - description: Значение лайка
        in: formData
        name: like
        required: true
        type: integer
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Лайк/Дизлайк композитора
      tags:
      - composers
  /composer/{id}/publish:
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: ID композитора
        in: path
        name: id
        required: true
        type: integer
      - description: Описание
        in: formData
        name: description
        type: string
      - description: Частота 1
        in: formData
        name: freq1
        type: number
      - description: Частота 2
        in: formData
        name: freq2
        type: number
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Публикация черновика композитора
      tags:
      - composers
  /composer/draft:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.Composer'
      summary: Получение черновика композитора
      tags:
      - composers
  /composer/feed:
    get:
      parameters:
      - description: Текущий ID
        in: query
        name: id
        type: integer
      - description: Запрос далее
        in: query
        name: next
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.Composer'
      summary: Получение ленты композиторов
      tags:
      - composers
  /composers:
    get:
      parameters:
      - description: Минимальная частота
        in: query
        name: min_freq
        type: number
      - description: Максимальная частота
        in: query
        name: max_freq
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ds.Composer'
            type: array
      summary: Получение списка опубликованных композиторов
      tags:
      - composers
  /user/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Учетные данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Авторизация (вход)
      tags:
      - auth
  /user/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Выход (деавторизация)
      tags:
      - auth
  /user/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные для регистрации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.registerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Регистрация пользователя
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
