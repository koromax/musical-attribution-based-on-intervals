name: composers_db

services:
  postgres:
    container_name: postgres
    image: postgres:15.0
    environment:
      POSTGRES_USER: koromax
      POSTGRES_PASSWORD: composers
      POSTGRES_DB: composers
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    container_name: adminer
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: