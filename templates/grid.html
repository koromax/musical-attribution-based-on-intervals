<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плитка - Анализатор</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>
<div class="app-container">

  <header class="header">
    <div class="header-bg"></div>
    <div class="header-title">Анализатор</div>
  </header>

  <main class="main-content">
    <div class="page-title">Запросы</div>

    <form class="filter-section" action="/grid" method="GET">
    <div class="filter-head">
        Фильтр частоты доминирующего<br>интервала
    </div>
    <div class="filter-body">
        <div class="input-group">
        <label class="input-label">от</label>
        <input type="number" step="0.1" name="query" value="{{ .query }}" class="filter-input" placeholder="0">
        </div>
        <div class="input-group">
        <label class="input-label">до</label>
        <input type="number" step="0.1" name="max_query" value="{{ .max_query }}" class="filter-input" placeholder="100">
        </div>
    </div>
    <button type="submit" style="display: none;"></button>
    </form>

    <div class="grid-cards">
    {{ range .items }}
    <a href="/feed/{{ .ID }}" class="grid-card">
        <img class="card-picture" src="{{ .ImageURL }}" alt="{{ .Title }}" />
        <div class="card-info">
        <div class="card-title">{{ .Title }}</div>
        <div class="card-freq">Частота: {{ .IntervalFrequency }}%</div>
        <div class="card-likes">
            <svg class="like-icon" width="20" height="18" viewBox="0 0 30 27" fill="none">
            <path d="M8.75 1.43C6.83 1.43 4.9 2.06 3.44 3.56C0.5 6.56 0.59 11.18 3.44 14.18L13.55 24.89C14.33 25.73 15.67 25.73 16.45 24.89L26.56 14.18C29.41 11.18 29.49 6.56 26.56 3.56C23.63 0.68 18.87 0.68 15.94 3.56C15.43 4.1 14.57 4.1 14.06 3.56C12.6 2.06 10.67 1.43 8.75 1.43Z" stroke="#EFEFF1" stroke-width="2.5"/>
            </svg>
            <span class="like-val">{{ .LikesCount }}</span>
        </div>
        </div>
    </a>
    {{ end }}
    </div>

  </main>

  <footer class="footer">
    <a href="/feed" class="nav-btn">
      <span class="nav-label">Лента</span>
    </a>
    <a href="/draft" class="nav-btn">
      <span class="nav-label">Добавление</span>
    </a>
    <a href="/grid" class="nav-btn active">
      <span class="nav-label">Плитка</span>
    </a>
  </footer>

</div>
</body>
</html>
